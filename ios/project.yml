# Source of truth for ios/Scryboard.xcodeproj. Regenerate with:
#   cd ios && xcodegen generate
# The generated project is gitignored; never hand-edit it.
name: Scryboard

options:
  bundleIdPrefix: com.fedg
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  disabledValidations: [missingConfigFiles]

# Local.xcconfig is gitignored and holds DEVELOPMENT_TEAM, so a regeneration
# never wipes the team chosen in Xcode. Copy Local.xcconfig.example to start.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

packages:
  ScryboardKit:
    path: ../ScryboardKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is deliberately absent: set it locally in Xcode, never commit it.
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MACCATALYST: NO

targets:
  Scryboard:
    type: application
    platform: iOS
    sources: [Scryboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fedg.scryboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # The App Group is how the container app's settings reach the extension.
    # XcodeGen writes the entitlements file from these properties; it is
    # gitignored like the project. Automatic signing registers the group.
    entitlements:
      path: Scryboard/Scryboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.fedg.scryboard]
    info:
      path: Scryboard/Info.plist
      properties:
        CFBundleDisplayName: Scryboard
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: ScryboardKit
        product: ScryboardKit
      - package: ScryboardKit
        product: ScryboardUI
      - target: ScryboardKeyboard
        embed: true

  ScryboardKeyboard:
    type: app-extension
    platform: iOS
    sources: [ScryboardKeyboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fedg.scryboard.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: ScryboardKeyboard/ScryboardKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.fedg.scryboard]
    info:
      path: ScryboardKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Scryboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Network access needs Full Access. Onboarding explains the prompt.
            RequestsOpenAccess: true
    dependencies:
      - package: ScryboardKit
        product: ScryboardKit
      - package: ScryboardKit
        product: ScryboardUI

schemes:
  Scryboard:
    build:
      targets:
        Scryboard: all
        ScryboardKeyboard: all
    run:
      config: Debug
    archive:
      config: Release
